- id: playback_streaming_failure
  name: Playback Streaming Failure
  definition: Customers reporting general streaming failures, technical difficulties,
    video playback errors, and service outages preventing them from watching shows
    or live TV.
  include: A message belongs here if the customer is reporting playback problems,
    app crashes, freezing, error messages, loading failures, or inquiring if the service
    is down.
  exclude: 'Messages should go to billing_dispute or account_management instead if
    the primary complaint is about subscription charges, payment failures, login issues,
    password resets, or missing content rather than technical streaming problems.
    | Ambiguous boundary: cluster 16 (generic "technical_difficulties", no explicit
    device/UI complaint) was merged here rather than into app_bugs_and_ui_complaints
    because its cluster siblings (8, 19, 28) all reference active watching. Likely
    a source of annotation disagreement.

    '
