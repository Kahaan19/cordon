brand: hulu_support
intents:
- id: account_login_access
  name: Account Login Access
  definition: Customers seeking assistance with login issues, password resets, account
    access, or suspected account compromises.
  include: Messages where the user states they cannot log in, need password assistance,
    or are experiencing account access errors.
  exclude: General billing or subscription payment disputes go to billing_inquiry
    instead of account access.
  positive_examples:
  - '273347'
  - '1727386'
  - '2244365'
  near_miss_examples:
  - tweet_id: '2098866'
    reason: closest non-member by embedding distance; labelled 'app_bugs_and_ui_complaints'
      instead
  - tweet_id: '54656'
    reason: closest non-member by embedding distance; labelled 'app_bugs_and_ui_complaints'
      instead
- id: ads_on_ad_free_plan
  name: Ads On Ad Free Plan
  definition: Customers complaining about seeing commercials despite paying for an
    ad-free subscription plan.
  include: Messages must express confusion or frustration about experiencing advertisements
    while subscribed to a commercial-free tier.
  exclude: General billing disputes about subscription prices belong in billing_dispute
    unless specifically complaining about commercials on an ad-free plan.
  positive_examples:
  - '249527'
  - '1246330'
  - '775936'
  near_miss_examples:
  - tweet_id: '1714677'
    reason: closest non-member by embedding distance; labelled 'app_bugs_and_ui_complaints'
      instead
  - tweet_id: '775195'
    reason: closest non-member by embedding distance; labelled 'app_bugs_and_ui_complaints'
      instead
- id: app_bugs_and_ui_complaints
  name: App Bugs And Ui Complaints
  definition: Customer complaints, frustration, and negative feedback regarding app
    bugs, navigation difficulties, performance glitches, watchlist sync errors, and
    unpopular user interface redesigns across various devices.
  include: Messages must explicitly mention technical malfunctions, crashes, buffering,
    freezing, loading errors, poor user interface design, layout updates, or watchlist
    synchronization problems on any device.
  exclude: 'Messages strictly about billing disputes, account management, unwanted
    subscription charges, or specific technical troubleshooting requests belong in
    billing_dispute or technical_support instead. | Ambiguous boundary: cluster 23
    ("technical_issues_and_complaints", mentions buffering and freezing) was merged
    here rather than into playback_streaming_failure because its LLM-generated definition
    leads with app malfunction/UI dissatisfaction. Likely a source of annotation disagreement.

    '
  positive_examples:
  - '207818'
  - '822963'
  - '1304516'
  near_miss_examples:
  - tweet_id: '2338141'
    reason: closest non-member by embedding distance; labelled 'live_tv_streaming_failure'
      instead
  - tweet_id: '1928572'
    reason: closest non-member by embedding distance; labelled 'live_tv_streaming_failure'
      instead
- id: customer_service_complaint
  name: Customer Service Complaint
  definition: Customers complaining about long wait times, unhelpful agents, or difficulty
    reaching customer support.
  include: Tweets expressing frustration with customer service channels, long hold
    times, unresponsive chat agents, or getting disconnected.
  exclude: Tweets concerning specific billing errors or technical playback issues
    should go to their respective functional intents instead of general customer service
    complaints.
  positive_examples:
  - '773303'
  - '376770'
  - '372056'
  near_miss_examples:
