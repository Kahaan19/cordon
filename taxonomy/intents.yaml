      instead
- id: missing_or_upcoming_content
  name: Missing Or Upcoming Content
  definition: Customers inquiring about, requesting, or reporting missing specific
    episodes, seasons, shows, movies, networks, or international content that are
    not currently available or updated on the platform.
  include: Messages must ask about the release date, absence, delayed upload, or request
    the addition of specific movies, TV show seasons, episodes, networks, or international
    access.
  exclude: Messages reporting technical playback issues, app errors, or general streaming
    performance belong in technical_issues because those involve troubleshooting rather
    than catalog availability.
  positive_examples:
