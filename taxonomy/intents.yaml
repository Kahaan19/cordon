    reason: closest non-member by embedding distance; labelled 'playback_streaming_failure'
      instead
  - tweet_id: '854652'
    reason: closest non-member by embedding distance; labelled 'playback_streaming_failure'
      instead
- id: live_tv_streaming_failure
  name: Live Tv Streaming Failure
  definition: Customers reporting constant buffering, lagging, poor video quality,
    or playback failures specifically while watching Hulu Live TV broadcasts.
  include: Messages must mention streaming issues such as constant buffering, skipping,
    loading problems, poor picture quality, or playback failures while watching live
    TV programming.
  exclude: General video playback issues on on-demand content go to general playback
    errors, and general app crashes or login issues unrelated to live streaming performance
    belong in the general app troubleshooting cluster instead.
  positive_examples:
  - '1480856'
  - '1487240'
  - '2498143'
