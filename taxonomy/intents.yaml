    reason: closest non-member by embedding distance; labelled 'app_bugs_and_ui_complaints'
      instead
  - tweet_id: '1287461'
    reason: closest non-member by embedding distance; labelled 'subscription_billing_refund'
      instead
- id: live_sports_streaming_issues
  name: Live Sports Streaming Issues
  definition: Customers experiencing technical problems, freezing, buffering, looping,
    errors, or playback failures specifically while trying to watch live sporting
    events and broadcasts.
  include: Messages must report technical difficulties, streaming failures, service
    outages, or playback errors while attempting to watch a live sports game, tournament,
    or playoff event.
  exclude: Messages about general VOD playback issues, app loading errors, or app
    crashes not related to live sports broadcasts belong in general technical support
    or playback error clusters instead.
  positive_examples:
  - '1825235'
  - '2449984'
  - '205884'
  near_miss_examples:
  - tweet_id: '2570594'
    reason: closest non-member by embedding distance; labelled 'live_tv_streaming_failure'
      instead
  - tweet_id: '2263588'
    reason: closest non-member by embedding distance; labelled 'playback_streaming_failure'
      instead
- id: live_tv_signup_or_access
  name: Live Tv Signup Or Access
  definition: Customers seeking assistance with subscribing to, activating, troubleshooting,
    accessing, or using Hulu + Live TV features and channels across various devices.
  include: Messages must explicitly mention Hulu with Live TV or live channels, asking
    for help with setup, device compatibility, streaming, accessing, or plan upgrades
    related to the live service.
  exclude: Messages focusing solely on general standard Hulu streaming, playback errors,
    or on-demand issues without any mention of Live TV belong in standard playback
    or general technical support instead.
  positive_examples:
  - '2257778'
  - '961066'
  - '2605444'
  near_miss_examples:
